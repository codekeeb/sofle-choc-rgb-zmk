on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Drop debug firmware from the release
        # The *_usb_logging variants are dev-only (chasing RGB/SPI bugs);
        # end users should never flash them.
        run: rm -f firmware/*_usb_logging*

      # Un unico zip con los .uf2 dentro. Antes se subian sueltos y habia
      # que rehacer el release a mano para empaquetarlos.
      - name: Package firmware into a single zip
        run: |
          cd firmware
          for f in *.uf2; do
            n="${f// /.}"
            [ "$f" = "$n" ] || mv "$f" "$n"
          done
          zip -j "../SofleChoc-${GITHUB_REF_NAME}.zip" *.uf2
          cd ..
          unzip -l "SofleChoc-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SofleChoc-${{ github.ref_name }}.zip
          generate_release_notes: true
